name: Deploy drdlamini.com to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore high-quality event photography
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/img
          if [ ! -s assets/img/meeting-of-minds-1-hq.png ] || [ ! -s assets/img/meeting-of-minds-2-hq.png ] || [ ! -s assets/img/governors-innovation-fellows-1-hq.png ] || [ ! -s assets/img/governors-innovation-fellows-2-hq.png ] || [ ! -s assets/img/cera-2025-hq.png ]; then
            curl --fail --location --retry 3 'https://media.canva.com/v2/document-image/hash:1065928136/height:516/id:DAHVsQ2bmDA/type:B/width:387?brand=BAC7M-SiPrY&csig=AAAAAAAAAAAAAAAAAAAAAL8n3WDRy5fzSoSmvB5Sbg7Jg5L6SGJvV1XGmYUc0vX8&exp=1789868229&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2F2bmDA%2FDAHVsQ2bmDA%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260919%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260919T131244Z%26X-Amz-Expires%3D47365%26X-Amz-Signature%3Dd3c33de1dd4fce21efd76c95c18fd27068fed346dba0cb11f21df7189343afd6%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DSun%252C%252020%2520Sep%25202026%252002%253A22%253A09%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAO2yz6d4b_iDBT6mDoOK9DVFM7EGuuZJnMVlc_ZQQa4k&page=1&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1' -o assets/img/meeting-of-minds-1-hq.png
            curl --fail --location --retry 3 'https://media.canva.com/v2/document-image/hash:-483797619/height:516/id:DAHVsUrN7Ug/type:B/width:387?brand=BAC7M-SiPrY&csig=AAAAAAAAAAAAAAAAAAAAAOdsLtAcunJ9_BrvgkBrlHVrYQaaeugCtNk_wAB_msoM&exp=1789868263&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FrN7Ug%2FDAHVsUrN7Ug%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260919%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260919T235213Z%26X-Amz-Expires%3D9030%26X-Amz-Signature%3D4500b269430037aeeaf6c623f741ee86ce9864aa2e625d234c0b21938ad381b9%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DSun%252C%252020%2520Sep%25202026%252002%253A22%253A43%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAADVVf-VZ0lhEXh0Wf4rF2xi9KhYbeG2ecQdmJot2XGEq&page=1&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1' -o assets/img/meeting-of-minds-2-hq.png
            curl --fail --location --retry 3 'https://media.canva.com/v2/document-image/hash:-485941961/height:387/id:DAHVsQIGURo/type:B/width:516?brand=BAC7M-SiPrY&csig=AAAAAAAAAAAAAAAAAAAAAMZWO1BJXo2WU0Onn6henqyPvVP6FPcXqxbk8rr7NYWl&exp=1789868284&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FIGURo%2FDAHVsQIGURo%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260919%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260919T060128Z%26X-Amz-Expires%3D73296%26X-Amz-Signature%3Dd2bd4bd6f0bab87d1fded965603d9592bb4a8c7e1696fc6ae43a9ace75674706%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DSun%252C%252020%2520Sep%25202026%252002%253A23%253A04%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAIJgFsgSEhlFW-r_wHWltas9JM54rql_IS2hWTm-Uywa&page=1&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1' -o assets/img/governors-innovation-fellows-1-hq.png
            curl --fail --location --retry 3 'https://media.canva.com/v2/document-image/hash:-1558748872/height:387/id:DAHVsSKJ-M0/type:B/width:516?brand=BAC7M-SiPrY&csig=AAAAAAAAAAAAAAAAAAAAALj5Xnr818oM-wMBN_wP0OtqWCufgNx9SrJcnIhv9_TT&exp=1789868310&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FKJ-M0%2FDAHVsSKJ-M0%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260919%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260919T094036Z%26X-Amz-Expires%3D60174%26X-Amz-Signature%3De4a44d512bf77c2cf259f733af45844c1d4d989d1384a35451f0a8c42b3b05ca%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DSun%252C%252020%2520Sep%25202026%252002%253A23%253A30%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAACW5RbQ7UdVnoZPTwz-9hwQmpmECtkxCRCTm0Z9xMb05&page=1&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1' -o assets/img/governors-innovation-fellows-2-hq.png
            curl --fail --location --retry 3 'https://media.canva.com/v2/document-image/hash:2102234530/height:387/id:DAHVsRNxpZI/type:B/width:516?brand=BAC7M-SiPrY&csig=AAAAAAAAAAAAAAAAAAAAAFMAbX4xE6YTCN4BWPixOYPaOZPMDbRpnbOKIYFKO6Ft&exp=1789868326&fallback=https%3A%2F%2Fs3.amazonaws.com%2Fdocument-export.canva.com%2FNxpZI%2FDAHVsRNxpZI%2F1%2Fthumbnail%2F0001.png%3FX-Amz-Algorithm%3DAWS4-HMAC-SHA256%26X-Amz-Credential%3DAKIAQYCGKMUH4GDRW44L%252F20260919%252Fus-east-1%252Fs3%252Faws4_request%26X-Amz-Date%3D20260919T060258Z%26X-Amz-Expires%3D73248%26X-Amz-Signature%3D82855420d57a33b6277267958441e78c8a03c7b2ae7724501e7eaefb01df92b8%26X-Amz-SignedHeaders%3Dhost%26response-expires%3DSun%252C%252020%2520Sep%25202026%252002%253A23%253A46%2520GMT&osig=AAAAAAAAAAAAAAAAAAAAAHZZOlRXEwOpR2JJVi2KD_cjXfiANCeXNsOs80Fkguou&page=1&signed=brand%2Cfallback%2Cpage%2Cversion&signer=document-rpc&version=1' -o assets/img/cera-2025-hq.png
            file assets/img/*-hq.png
            test $(stat -c%s assets/img/meeting-of-minds-1-hq.png) -gt 5000
            test $(stat -c%s assets/img/meeting-of-minds-2-hq.png) -gt 5000
            test $(stat -c%s assets/img/governors-innovation-fellows-1-hq.png) -gt 5000
            test $(stat -c%s assets/img/governors-innovation-fellows-2-hq.png) -gt 5000
            test $(stat -c%s assets/img/cera-2025-hq.png) -gt 5000
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/img/*-hq.png
            git commit -m "Add high-quality event photography"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
